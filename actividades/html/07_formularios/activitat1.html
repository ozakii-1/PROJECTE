  <section id="activities">
    <h2>Actividad 1 — <span>Formularios</span></h2>
    <div class="section-line"></div>

    <p>En esta actividad creamos un formulario básico con diferentes tipos de campos.</p>

    <form style="max-width:400px;margin-top:24px;display:flex;flex-direction:column;gap:12px;">
      <label>
        Nombre:
        <input type="text" name="nombre" placeholder="Escribe tu nombre" style="width:100%;padding:8px;border-radius:4px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:white;">
      </label>

      <label>
        Correo electrónico:
        <input type="email" name="email" placeholder="tucorreo@ejemplo.com" style="width:100%;padding:8px;border-radius:4px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:white;">
      </label>

      <label>
        Mensaje:
        <textarea name="mensaje" rows="4" style="width:100%;padding:8px;border-radius:4px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:white;"></textarea>
      </label>

      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" name="condiciones">
        Acepto las condiciones
      </label>

      <button type="submit" class="btn btn-red" style="align-self:flex-start;">Enviar</button>
    </form>

    <p style="margin-top:24px;">
      <a class="btn btn-outline" href="../../actividades.html">Volver al menú de actividades</a>
    </p>
  </section>
